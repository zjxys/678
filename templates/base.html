<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}高考语文作文批改{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="logo">
                <span class="logo-icon">文</span>
                <span class="logo-text">高考作文批改</span>
            </a>
            <nav class="nav">
                <a href="/">首页</a>
                <a href="/#criteria">评分标准</a>
                <a href="/#about">关于</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>高考语文作文自动批改框架 &middot; 基于 NLP 与规则引擎 &middot; MIT License</p>
            <p class="footer-note">本工具仅供学习参考，评分结果不代表真实高考评分。</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
